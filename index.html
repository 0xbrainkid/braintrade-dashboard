<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brainTrade — Live Trading Dashboard</title>
<meta http-equiv="refresh" content="60">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e0;
    --dim: #6b7280;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #eab308;
    --purple: #a855f7;
    --cyan: #06b6d4;
    --orange: #f97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 1.4em; }
  .header .live { color: var(--green); font-size: 0.8em; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .header .updated { color: var(--dim); font-size: 0.75em; }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card-title { color: var(--dim); font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .card-value { font-size: 1.8em; font-weight: 700; }
  .card-sub { color: var(--dim); font-size: 0.75em; margin-top: 4px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }
  .purple { color: var(--purple); }
  .cyan { color: var(--cyan); }
  .orange { color: var(--orange); }

  .section-title { 
    font-size: 0.85em; font-weight: 600; color: var(--dim); 
    margin: 24px 0 10px; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  
  table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
  th { text-align: left; color: var(--dim); padding: 8px; font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.off { background: var(--red); }

  .chart-bar { height: 24px; border-radius: 3px; margin: 2px 0; min-width: 2px; display: inline-block; vertical-align: middle; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 0.75em; }
  .chart-label { width: 45px; color: var(--dim); text-align: right; }
  .chart-val { width: 60px; font-weight: 600; }

  .pillar { margin-bottom: 20px; }
  .pillar-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .pillar-title { font-size: 0.9em; font-weight: 700; }
  .pillar-pct { font-size: 1.1em; font-weight: 700; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

  .insight { 
    background: #0d1117; border-left: 3px solid var(--cyan); 
    padding: 8px 12px; margin: 6px 0; font-size: 0.75em; border-radius: 0 4px 4px 0;
  }
  .insight .label { color: var(--cyan); font-weight: 600; font-size: 0.85em; }
  .insight .detail { color: var(--dim); margin-top: 2px; }

  .evolution-item {
    display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; font-size: 0.75em;
  }
  .evo-date { color: var(--dim); min-width: 50px; }
  .evo-text { flex: 1; }
  .evo-impact { font-weight: 600; min-width: 60px; text-align: right; }

  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { 
    padding: 6px 14px; border-radius: 4px; font-size: 0.75em; cursor: pointer;
    background: var(--card); border: 1px solid var(--border); color: var(--dim);
  }
  .tab.active { background: var(--border); color: var(--text); border-color: var(--blue); }

  .metric-row {
    display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px solid var(--border); font-size: 0.8em;
  }
  .metric-label { color: var(--dim); }
  .metric-value { font-weight: 600; }

  .copy-signal {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    font-size: 0.7em; font-weight: 600; margin: 2px;
  }
  .signal-bullish { background: rgba(34,197,94,0.15); color: var(--green); }
  .signal-bearish { background: rgba(239,68,68,0.15); color: var(--red); }
  .signal-neutral { background: rgba(107,114,128,0.15); color: var(--dim); }
  .mode-pill {
    display: inline-block; padding: 3px 8px; border-radius: 999px;
    font-size: 0.75em; font-weight: 700; letter-spacing: 0.3px;
  }
  .mode-live { background: rgba(34,197,94,0.15); color: var(--green); }
  .mode-notional { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .mode-wallet { background: rgba(239,68,68,0.15); color: var(--red); }
  .mode-unknown { background: rgba(107,114,128,0.15); color: var(--dim); }
  .p4-state-panel {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(13,17,23,0.75);
  }
  .p4-state-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.8em;
  }
  .p4-bucket {
    font-weight: 700;
    color: var(--yellow);
  }
  .p4-bucket.tradeable { color: var(--green); }
  .p4-bucket.blocked { color: var(--red); }
  .p4-state-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
    gap: 8px;
  }
  .p4-blockers {
    color: var(--dim);
    font-size: 0.75em;
    margin-top: 8px;
    line-height: 1.45;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 brainTrade</h1>
    <span style="color: var(--dim); font-size: 0.75em;">Autonomous Trading Agent — brainAI</span>
  </div>
  <div style="text-align: right;">
    <div class="live">● LIVE</div>
    <div class="updated" id="updated"></div>
  </div>
</div>

<!-- Top cards -->
<div class="grid" id="top-cards"></div>

<!-- P&L Chart -->
<!-- Work Log -->
<div class="section-title">📝 Live Work Log</div>
<div id="worklog" style="max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; font-family: monospace; margin-bottom: 20px;"></div>

<div class="section-title">📈 Daily P&L</div>
<div id="pnl-chart"></div>

<!-- ═══ PILLAR 1: COPY INTELLIGENCE ═══ -->
<div class="section-title" style="color: var(--cyan);">🧠 PILLAR 1 — Copy Intelligence</div>
<div class="pillar" id="pillar1"></div>

<!-- ═══ PILLAR 2: EDGE DEVELOPMENT ═══ -->
<div class="section-title" style="color: var(--purple);">⚡ PILLAR 2 — Edge Development</div>
<div class="pillar" id="pillar2"></div>

<!-- ═══ PILLAR 3: CONTINUOUS ITERATION ═══ -->
<div class="section-title" style="color: var(--orange);">🔄 PILLAR 3 — Continuous Iteration</div>
<div class="pillar" id="pillar3"></div>

<!-- ═══ PILLAR 4: ALPHA RESEARCH PIPELINE ═══ -->
<div class="section-title" style="color: var(--green);">🔬 PILLAR 4 — Alpha Research Pipeline</div>
<div class="pillar" id="pillar4"></div>

<!-- Open Positions -->
<div class="section-title">📋 Open Positions</div>
<div id="positions"></div>

<!-- Funding Opportunities -->
<div class="section-title">💰 Top Funding Rate Opportunities</div>
<div id="funding"></div>

<script>
async function loadData() {
  try {
    const resp = await fetch('data.json?' + Date.now());
    const d = await resp.json();
    
    document.getElementById('updated').textContent = new Date(d.timestamp).toLocaleString() + ' UTC';
    
    const totalBal = d.pm_balance + d.hl_balance;
    const todayClass = d.today_pnl >= 0 ? 'green' : 'red';
    const allTimeClass = d.all_time_pnl >= 0 ? 'green' : 'red';
    const winRate = d.today_wins + d.today_losses > 0 
      ? ((d.today_wins / (d.today_wins + d.today_losses)) * 100).toFixed(0) 
      : '—';
    
    document.getElementById('top-cards').innerHTML = `
      <div class="card">
        <div class="card-title">Total Capital</div>
        <div class="card-value">$${totalBal.toFixed(2)}</div>
        <div class="card-sub">PM: $${d.pm_balance.toFixed(2)} · HL: $${d.hl_balance.toFixed(2)}</div>
      </div>
      <div class="card">
        <div class="card-title">Today P&L</div>
        <div class="card-value ${todayClass}">${d.today_pnl >= 0 ? '+' : ''}$${d.today_pnl.toFixed(2)}</div>
        <div class="card-sub">PM: $${d.pm_pnl.toFixed(2)} · HL: $${d.hl_pnl.toFixed(2)}</div>
      </div>
      <div class="card">
        <div class="card-title">All-Time P&L</div>
        <div class="card-value ${allTimeClass}">${d.all_time_pnl >= 0 ? '+' : ''}$${d.all_time_pnl.toFixed(2)}</div>
        <div class="card-sub">${d.days_active} days active · ${d.total_trades} trades</div>
      </div>
      <div class="card">
        <div class="card-title">Today Stats</div>
        <div class="card-value">${winRate}%</div>
        <div class="card-sub">${d.today_wins}W / ${d.today_losses}L · ${d.today_trades} trades</div>
      </div>
    `;
    
    // Pillar 4: Alpha Research Pipeline
    if (d.pillar4) {
      const p = d.pillar4;
      const gate = p.trade_gate_summary || {};
      const stability = p.transition_stability || {};
      const bucket = gate.expansion_resolution_bucket || stability.expansion_resolution_bucket || 'unknown';
      const bucketLabel = bucket.replaceAll('_', ' ').toUpperCase();
      const recommendation = gate.transition_stability_recommendation || stability.recommendation || 'UNKNOWN';
      const clearanceScore = gate.transition_live_clearance_score ?? stability.live_clearance_score ?? '—';
      const clearanceTotal = gate.transition_live_clearance_total ?? stability.live_clearance_total ?? '—';
      const bucketClass = bucket === 'resolved_range_tradeable' ? 'tradeable' : (recommendation === 'BLOCK_LIVE' ? 'blocked' : '');
      const blockers = gate.transition_stability_blockers || stability.blockers || [];
      const attribution = gate.transition_blocker_attribution || stability.blocker_attribution || {};
      const attributionCounts = attribution.counts || {};
      const attributionText = Object.entries(attributionCounts).map(([k, v]) => `${k.replaceAll('_', ' ')}: ${v}`).join(' · ');
      const freshness = gate.transition_source_freshness || stability.source_freshness || {};
      const freshnessSummary = freshness.summary || {};
      const freshnessText = freshnessSummary.total_count ? `${freshnessSummary.fresh_count}/${freshnessSummary.total_count}` : '—';
      const staleSources = freshnessSummary.stale_sources || [];
      let html = `<div class="progress-bar"><div class="progress-fill" style="width:${p.completion}%;background:var(--green)">${p.completion}%</div></div>`;
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px;">`;
      html += `<div class="stat-box"><div class="stat-value">${p.data_sources||0}</div><div class="stat-label">Data Sources</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${p.signals_generated||0}</div><div class="stat-label">Signals Generated</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${p.research_files||0}</div><div class="stat-label">Research Files</div></div>`;
      html += `</div>`;
      html += `<div class="p4-state-panel">`;
      html += `<div class="p4-state-head"><span>Expansion Resolution</span><span class="p4-bucket ${bucketClass}">${bucketLabel}</span></div>`;
      html += `<div class="p4-state-grid">`;
      html += `<div class="stat-box"><div class="stat-value">${recommendation}</div><div class="stat-label">Gate</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${clearanceScore}/${clearanceTotal}</div><div class="stat-label">Clearance</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${gate.hours_since_last_expansion ?? stability.hours_since_last_expansion ?? '—'}h</div><div class="stat-label">Since Expansion</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${gate.range_friendly_streak ?? stability.range_friendly_streak ?? '—'}/${gate.high_risk_streak ?? stability.high_risk_streak ?? '—'}</div><div class="stat-label">Range / Risk Streak</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${(attribution.primary_group || '—').replaceAll('_', ' ')}</div><div class="stat-label">Primary Block</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${freshnessText}</div><div class="stat-label">Fresh Sources</div></div>`;
      html += `</div>`;
      if (attributionText) {
        html += `<div class="p4-blockers">Groups: ${attributionText}</div>`;
      }
      if (blockers.length) {
        html += `<div class="p4-blockers">Blockers: ${blockers.slice(0, 6).join(', ')}${blockers.length > 6 ? ' +' + (blockers.length - 6) + ' more' : ''}</div>`;
      }
      if (staleSources.length) {
        html += `<div class="p4-blockers">Stale inputs: ${staleSources.join(', ')}</div>`;
      }
      html += `</div>`;
      if (p.sources && p.sources.length) {
        html += '<table style="margin-top:10px"><tr><th>Source</th><th>Status</th><th>Last Signal</th></tr>';
        for (const s of p.sources) {
          const statusColor = s.status === 'ACTIVE' ? 'var(--green)' : s.status === 'BUILDING' ? 'var(--orange)' : 'var(--muted)';
          html += `<tr><td>${s.name}</td><td style="color:${statusColor}">${s.status}</td><td>${s.last_signal||'—'}</td></tr>`;
        }
        html += '</table>';
      }
      document.getElementById('pillar4').innerHTML = html;
    }

    // Work Log
    if (d.worklog) {
      document.getElementById('worklog').textContent = d.worklog;
    } else {
      document.getElementById('worklog').textContent = 'No work log entries yet.';
    }

    // P&L Chart
    if (d.daily_pnl && d.daily_pnl.length) {
      const maxAbs = Math.max(...d.daily_pnl.map(x => Math.abs(x.pnl)), 1);
      let chartHtml = '';
      for (const day of d.daily_pnl) {
        const pct = Math.abs(day.pnl) / maxAbs * 100;
        const color = day.pnl >= 0 ? 'var(--green)' : 'var(--red)';
        const cls = day.pnl >= 0 ? 'green' : 'red';
        chartHtml += `<div class="chart-row">
          <span class="chart-label">${day.date}</span>
          <div class="chart-bar" style="width:${Math.max(pct, 2)}%;background:${color}"></div>
          <span class="chart-val ${cls}">${day.pnl >= 0 ? '+' : ''}$${day.pnl.toFixed(0)}</span>
        </div>`;
      }
      document.getElementById('pnl-chart').innerHTML = chartHtml;
    }

    // ═══ PILLAR 1: COPY INTELLIGENCE ═══
    const p1 = d.pillar1 || {};
    const p1pct = p1.completion || 80;
    document.getElementById('pillar1').innerHTML = `
      <div class="pillar-header">
        <span class="pillar-title cyan">How well do I understand what winning traders do?</span>
        <span class="pillar-pct cyan">${p1pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p1pct}%;background:var(--cyan)"></div></div>
      
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="card">
          <div class="card-title">Traders Tracked</div>
          <div class="card-value cyan">${p1.traders_tracked || 0}</div>
          <div class="card-sub">Top PM wallets monitored</div>
        </div>
        <div class="card">
          <div class="card-title">Copy Signal</div>
          <div class="card-value"><span class="copy-signal ${p1.current_bias === 'bullish' ? 'signal-bullish' : p1.current_bias === 'bearish' ? 'signal-bearish' : 'signal-neutral'}">${(p1.current_bias || 'neutral').toUpperCase()}</span></div>
          <div class="card-sub">Confidence: ${p1.signal_confidence || 0}/100</div>
        </div>
        <div class="card">
          <div class="card-title">Signals Today</div>
          <div class="card-value cyan">${p1.signals_today || 0}</div>
          <div class="card-sub">Fed into trading decisions</div>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">📡 Latest Insights</div>
        ${(p1.insights || []).map(i => `
          <div class="insight">
            <div class="label">${i.source}</div>
            <div class="detail">${i.text}</div>
          </div>
        `).join('') || '<div class="card-sub">No insights yet — scanner collecting data</div>'}
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">🧬 Evolution Log</div>
        ${(p1.evolution || []).map(e => `
          <div class="evolution-item">
            <span class="evo-date">${e.date}</span>
            <span class="evo-text">${e.change}</span>
            <span class="evo-impact ${e.impact_class || ''}">${e.impact || ''}</span>
          </div>
        `).join('') || '<div class="card-sub">Tracking starts today</div>'}
      </div>
    `;

    // ═══ PILLAR 2: EDGE DEVELOPMENT ═══
    const p2 = d.pillar2 || {};
    const p2pct = p2.completion || 85;
    const hgs = p2.hour_gate_summary || {};
    const p2Shadow03 = hgs.shadow_03_bias_comparator || p2.shadow_03_bias_comparator || {};
    const p2Best03 = p2Shadow03.best_proxy_band_stats || {};
    const p2Gate03 = p2Shadow03.gate_health || {};
    const p2Promo = p2Shadow03.promotion_gate || {};
    const p2Fresh = hgs.outcome_freshness || {};
    const p2Labels = hgs.label_collector || p2.label_collector || {};
    const p2Totals = p2Labels.totals || {};
    const p2Blockers = [
      ...((p2Promo.blockers || []).slice(0, 3)),
      ...(((hgs.live_edit_gate || {}).blockers || []).slice(0, 3))
    ];
    document.getElementById('pillar2').innerHTML = `
      <div class="pillar-header">
        <span class="pillar-title purple">How sharp are my trading strategies?</span>
        <span class="pillar-pct purple">${p2pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p2pct}%;background:var(--purple)"></div></div>
      
      <table>
        <tr><th>Strategy</th><th>Status</th><th>Trades</th><th>Win Rate</th><th>P&L</th><th>Sharpe</th></tr>
        ${(p2.strategies || []).map(s => `
          <tr>
            <td>${s.name}</td>
            <td><span class="status-dot ${s.status === 'LIVE' ? 'on' : 'off'}"></span>${s.status}</td>
            <td>${s.trades}</td>
            <td class="${s.win_rate >= 60 ? 'green' : s.win_rate >= 50 ? 'yellow' : 'red'}">${s.win_rate}%</td>
            <td class="${s.pnl >= 0 ? 'green' : 'red'}">${s.pnl >= 0 ? '+' : ''}$${s.pnl.toFixed(2)}</td>
            <td class="${s.sharpe >= 1 ? 'green' : s.sharpe >= 0.5 ? 'yellow' : 'red'}">${s.sharpe.toFixed(2)}</td>
          </tr>
        `).join('') || '<tr><td colspan="6" class="card-sub">Loading strategies...</td></tr>'}
      </table>

      <div style="margin-top: 10px;">
        <div class="card-title">03 UTC Smart Entry Gate</div>
        <div class="insight">
          <div class="label">${p2Shadow03.best_proxy_band || 'proxy band'} · ${p2Shadow03.decision || 'research only'}</div>
          <div class="detail">
            common rows ${p2Shadow03.common_gate_rows ?? 'n/a'} · best rows ${p2Best03.n ?? 'n/a'} ·
            WR ${p2Best03.wr ?? 'n/a'}% · Wilson low ${p2Best03.wilson_low ?? 'n/a'} ·
            realized post-retirement ${p2Shadow03.post_retirement_realized_rows ?? p2Totals.realized_post_retirement_labels ?? 'n/a'}
          </div>
          <div class="detail">
            common dates ${p2Gate03.common_gate_distinct_dates ?? 'n/a'} · source age ${p2Gate03.source_age_hours ?? 'n/a'}h ·
            cluster warning ${p2Gate03.cluster_warning_active ? 'active' : 'clear'}
          </div>
          <div class="detail">
            evidence ${p2Gate03.diff_vs_previous?.evidence_status || 'n/a'} ·
            rows Δ ${p2Gate03.diff_vs_previous?.common_gate_rows_delta ?? 'n/a'} ·
            dates Δ ${p2Gate03.diff_vs_previous?.common_gate_distinct_dates_delta ?? 'n/a'} ·
            realized Δ ${p2Gate03.diff_vs_previous?.post_retirement_realized_rows_delta ?? 'n/a'}
          </div>
        </div>
        <div class="insight">
          <div class="label">Freshness</div>
          <div class="detail">
            realized rows ${p2Fresh.rows ?? 'n/a'} · last ${p2Fresh.last_ts || 'n/a'} ·
            age ${p2Fresh.last_age_hours ?? 'n/a'}h · alpha context ${hgs.alpha_context_rows ?? 0}
          </div>
        </div>
        <div class="card-sub">${p2Blockers.length ? p2Blockers.join(' · ') : 'No P2 blockers reported'}</div>
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">🔬 Edge Metrics Over Time</div>
        ${(p2.edge_history || []).map(e => `
          <div class="evolution-item">
            <span class="evo-date">${e.date}</span>
            <span class="evo-text">${e.change}</span>
            <span class="evo-impact ${e.impact_class || ''}">${e.impact || ''}</span>
          </div>
        `).join('') || '<div class="card-sub">Tracking starts today</div>'}
      </div>
    `;

    // ═══ PILLAR 3: CONTINUOUS ITERATION ═══
    const p3 = d.pillar3 || {};
    const p3pct = p3.completion || 70;
    const hlMode = p3.hl_live_execution_mode || p3.hl_live_status || 'unknown';
    const hlModeClass = hlMode === 'live_tradeable' ? 'mode-live' : hlMode === 'notional_blocked' ? 'mode-notional' : hlMode === 'wallet_blocked' ? 'mode-wallet' : 'mode-unknown';
    const hlPlanned = Number(p3.hl_live_planned_order_notional || 0);
    const hlMinNotional = Number(p3.hl_live_min_order_notional_usd || 0);
    const paperHealth = p3.paper_health || {};
    const replayWatch = p3.short_aligned_replay_watch || {};
    const replayCurrent30 = replayWatch.current_30m || {};
    const replayDeduped30 = replayWatch.deduped_30m || {};
    const replayCoinAudit = replayWatch.coin_filter_audit || {};
    const replayPresentCoins = (replayCoinAudit.present_unique_coins || []).join(', ') || 'none';
    const replayAbsentCoins = (replayCoinAudit.absent_unique_coins || []).join(', ') || 'none';
    const replayNonDoge30 = replayCoinAudit.non_doge_30m || {};
    const replayStateClass = replayWatch.state === 'BLOCK_LIVE' ? 'red' : replayWatch.state === 'ready_review' ? 'green' : 'yellow';
    const replayCurrentWr = replayCurrent30.wr === null || replayCurrent30.wr === undefined ? '—' : `${replayCurrent30.wr}%`;
    const replayDedupedWr = replayDeduped30.wr === null || replayDeduped30.wr === undefined ? '—' : `${replayDeduped30.wr}%`;
    const replayCurrentRxe = replayCurrent30.rxe_bp === null || replayCurrent30.rxe_bp === undefined ? '—' : `${Number(replayCurrent30.rxe_bp).toFixed(2)} bp`;
    const replayDedupedRxe = replayDeduped30.rxe_bp === null || replayDeduped30.rxe_bp === undefined ? '—' : `${Number(replayDeduped30.rxe_bp).toFixed(2)} bp`;
    const replayNonDogeWr = replayNonDoge30.wr === null || replayNonDoge30.wr === undefined ? '—' : `${replayNonDoge30.wr}%`;
    const replayNonDogeRxe = replayNonDoge30.rxe_bp === null || replayNonDoge30.rxe_bp === undefined ? '—' : `${Number(replayNonDoge30.rxe_bp).toFixed(2)} bp`;
    const replayBlockers = (replayWatch.promotion_blockers || []).join(', ');
    const paperStatusClass = (paperHealth.status || '').startsWith('INVESTIGATE') ? 'red' : paperHealth.status === 'FRESH' ? 'green' : 'yellow';
    document.getElementById('pillar3').innerHTML = `
      <div class="pillar-header">
        <span class="pillar-title orange">How fast am I learning and adapting?</span>
        <span class="pillar-pct orange">${p3pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p3pct}%;background:var(--orange)"></div></div>
      
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="card">
          <div class="card-title">Parameters Changed</div>
          <div class="card-value orange">${p3.params_changed || 0}</div>
          <div class="card-sub">Data-backed adjustments</div>
        </div>
        <div class="card">
          <div class="card-title">Research Reports</div>
          <div class="card-value orange">${p3.research_reports || 0}</div>
          <div class="card-sub">Analysis documents generated</div>
        </div>
        <div class="card">
          <div class="card-title">Heartbeats Today</div>
          <div class="card-value orange">${p3.heartbeats_today || 0}</div>
          <div class="card-sub">Active review cycles</div>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">⚙️ HL Execution State</div>
        <div class="metric-row"><span class="metric-label">Mode</span><span class="metric-value"><span class="mode-pill ${hlModeClass}">${hlMode}</span></span></div>
        <div class="metric-row"><span class="metric-label">Exec Wallet</span><span class="metric-value">${(p3.hl_exec_wallet || '—').slice(0, 8)}…${(p3.hl_exec_wallet || '').slice(-4)}</span></div>
        <div class="metric-row"><span class="metric-label">Exec Balance</span><span class="metric-value">$${Number(p3.hl_exec_balance || p3.hl_live_balance || 0).toFixed(2)}</span></div>
        <div class="metric-row"><span class="metric-label">Planned Notional</span><span class="metric-value ${p3.hl_live_order_notional_blocked ? 'yellow' : 'green'}">$${hlPlanned.toFixed(2)} / $${hlMinNotional.toFixed(2)}</span></div>
        <div class="metric-row"><span class="metric-label">Wallet Aligned</span><span class="metric-value ${p3.hl_wallet_misaligned ? 'red' : 'green'}">${p3.hl_wallet_misaligned ? 'NO' : 'YES'}</span></div>
        <div class="metric-row"><span class="metric-label">Paper Health</span><span class="metric-value ${paperStatusClass}">${paperHealth.status || '—'}</span></div>
        <div class="metric-row"><span class="metric-label">Paper Source Age</span><span class="metric-value ${paperHealth.paper_stale ? 'yellow' : 'green'}">${paperHealth.paper_age_minutes ?? '—'}m${paperHealth.paper_stale ? ' STALE' : ''}</span></div>
        <div class="metric-row"><span class="metric-label">Paper Decision</span><span class="metric-value ${paperHealth.decision === 'do_not_restart' ? 'green' : 'yellow'}">${paperHealth.decision || '—'}</span></div>
        <div class="card-sub">${p3.hl_directional_surface_summary || 'HL execution state loading'}</div>
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">Short-Aligned Replay Watch</div>
        <div class="metric-row"><span class="metric-label">State</span><span class="metric-value ${replayStateClass}">${replayWatch.state || '—'}</span></div>
        <div class="metric-row"><span class="metric-label">Current Strict Rows</span><span class="metric-value ${(replayWatch.current_candidate_rows || 0) >= 30 ? 'green' : 'yellow'}">${replayWatch.current_candidate_rows ?? '—'} / ${(replayWatch.thresholds || {}).min_current_n ?? 30}</span></div>
        <div class="metric-row"><span class="metric-label">Unique Ledger Rows</span><span class="metric-value ${(replayWatch.unique_candidate_rows || 0) >= 50 ? 'green' : 'yellow'}">${replayWatch.unique_candidate_rows ?? '—'} / ${(replayWatch.thresholds || {}).min_deduped_n ?? 50}</span></div>
        <div class="metric-row"><span class="metric-label">Current 30m</span><span class="metric-value ${(replayCurrent30.wr || 0) >= 62 ? 'green' : 'yellow'}">${replayCurrent30.n ?? '—'} rows | ${replayCurrentWr} | ${replayCurrentRxe}</span></div>
        <div class="metric-row"><span class="metric-label">Deduped 30m</span><span class="metric-value ${(replayDeduped30.wr || 0) >= 62 ? 'green' : 'yellow'}">${replayDeduped30.n ?? '—'} rows | ${replayDedupedWr} | ${replayDedupedRxe}</span></div>
        <div class="metric-row"><span class="metric-label">Unique Coins</span><span class="metric-value ${replayCoinAudit.doge_only_unique_evidence ? 'yellow' : 'green'}">${replayPresentCoins}</span></div>
        <div class="metric-row"><span class="metric-label">Absent Coins</span><span class="metric-value">${replayAbsentCoins}</span></div>
        <div class="metric-row"><span class="metric-label">Non-DOGE 30m</span><span class="metric-value ${(replayNonDoge30.n || 0) > 0 ? 'green' : 'yellow'}">${replayNonDoge30.n || 0} rows | ${replayNonDogeWr} | ${replayNonDogeRxe}</span></div>
        <div class="metric-row"><span class="metric-label">Latest Unique</span><span class="metric-value">${replayWatch.latest_unique_candidate_ts || '—'}</span></div>
        <div class="metric-row"><span class="metric-label">Replay Duplicates</span><span class="metric-value">${replayWatch.duplicate_replay_rows_removed ?? '—'} removed / ${replayWatch.observed_candidate_rows_with_replays ?? '—'} observed</span></div>
        <div class="card-sub">${replayCoinAudit.promotion_blocker || replayBlockers || replayWatch.decision || 'Replay bridge awaiting fresh candidates'}</div>
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">🧪 HL Paper Strategy Branches</div>
        ${(p3.strategy_branches || []).map(b => {
          const status = b.status || 'paper';
          const statusClass = status === 'BLOCK_LIVE' ? 'red' : status === 'ready_review' ? 'green' : 'yellow';
          const wr = b.wr_15m === null || b.wr_15m === undefined ? '—' : `${b.wr_15m}%`;
          const avg = b.avg_15m === null || b.avg_15m === undefined ? '—' : `${Number(b.avg_15m).toFixed(4)}`;
          const sourceAge = b.source_age_minutes === null || b.source_age_minutes === undefined ? '' : `source age: ${b.source_age_minutes}m${b.source_stale ? ' STALE' : ''}`;
          const suppressorDetails = b.name === 'hl_paper_suppressor_labels_v0'
            ? [
                `TRUMP TREND/UP: ${b.trump_trend_up_wr_15m ?? '—'}% 15m / ${b.trump_trend_up_wr_30m ?? '—'}% 30m`,
                `ONDO watch 30m: ${b.ondo_watch_wr_30m ?? '—'}%`,
                `WIF mixed low-breakout 15m: ${b.wif_mixed_low_breakout_wr_15m ?? '—'}%`
              ].join(' | ')
            : '';
          const details = [
            b.candidate_filter ? `filter: ${b.candidate_filter}` : '',
            b.unique_candidate_rows === null || b.unique_candidate_rows === undefined ? '' : `unique rows: ${b.unique_candidate_rows}`,
            b.deduped_30m_wr === null || b.deduped_30m_wr === undefined ? '' : `deduped 30m: ${b.deduped_30m_wr}% / ${Number(b.deduped_30m_rxe_bp || 0).toFixed(2)} bp`,
            b.broad_pass_filter_is_live_quality === false ? 'broad pass_filter: NOT live quality' : '',
            suppressorDetails,
            sourceAge,
            b.block_reason || ''
          ].filter(Boolean).join(' | ');
          return `
            <div class="evolution-item">
              <span class="evo-date ${statusClass}">${status}</span>
              <span class="evo-text">${b.name || 'branch'} — rows ${b.rows ?? '—'} | 15m WR ${wr} | avg ${avg}</span>
              <span class="evo-impact ${statusClass}">${b.live_ready === false || status.includes('DO_NOT_CHANGE_LIVE') ? 'BLOCK' : 'WATCH'}</span>
              ${details ? `<div class="card-sub" style="width:100%;margin-top:4px;">${details}</div>` : ''}
            </div>
          `;
        }).join('') || '<div class="card-sub">No paper branches tracked</div>'}
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">🔧 Recent Changes</div>
        ${(p3.changes || []).map(c => `
          <div class="evolution-item">
            <span class="evo-date">${c.date}</span>
            <span class="evo-text">${c.change || ''}</span>
            <span class="evo-impact ${c.impact_class || ''}">${c.impact || ''}</span>
          </div>
        `).join('') || '<div class="card-sub">No changes yet</div>'}
      </div>

      <div style="margin-top: 10px;">
        <div class="card-title">📊 Performance Trend</div>
        <div class="metric-row"><span class="metric-label">Win Rate (7d)</span><span class="metric-value ${(p3.win_rate_7d||0) >= 60 ? 'green' : 'yellow'}">${p3.win_rate_7d || '—'}%</span></div>
        <div class="metric-row"><span class="metric-label">Win Rate (24h)</span><span class="metric-value ${(p3.win_rate_24h||0) >= 60 ? 'green' : 'yellow'}">${p3.win_rate_24h || '—'}%</span></div>
        <div class="metric-row"><span class="metric-label">Avg Trade Size</span><span class="metric-value">$${p3.avg_trade_size || '—'}</span></div>
        <div class="metric-row"><span class="metric-label">Sharpe Ratio</span><span class="metric-value ${(p3.sharpe||0) >= 1 ? 'green' : 'yellow'}">${p3.sharpe || '—'}</span></div>
        <div class="metric-row"><span class="metric-label">Max Drawdown</span><span class="metric-value red">${p3.max_drawdown || '—'}%</span></div>
      </div>
    `;

    // Positions
    if (d.hl_positions && d.hl_positions.length) {
      let posHtml = '<table><tr><th>Coin</th><th>Side</th><th>Size</th><th>Entry</th><th>PnL</th><th>Lev</th></tr>';
      for (const p of d.hl_positions) {
        const pnlClass = p.pnl >= 0 ? 'green' : 'red';
        posHtml += `<tr>
          <td>${p.coin}</td>
          <td>${p.side}</td>
          <td>${p.size}</td>
          <td>$${p.entry}</td>
          <td class="${pnlClass}">${p.pnl >= 0 ? '+' : ''}$${p.pnl.toFixed(2)}</td>
          <td>${p.leverage}x</td>
        </tr>`;
      }
      posHtml += '</table>';
      document.getElementById('positions').innerHTML = posHtml;
    } else {
      document.getElementById('positions').innerHTML = '<div class="card-sub">No open positions</div>';
    }

    // Funding
    if (d.funding_opportunities && d.funding_opportunities.length) {
      let fundHtml = '<table><tr><th>Coin</th><th>Rate/8h</th><th>APR</th><th>Action</th><th>OI</th></tr>';
      for (const f of d.funding_opportunities.slice(0, 8)) {
        const cls = f.apr.startsWith('+') ? 'red' : 'green';
        fundHtml += `<tr>
          <td>${f.coin}</td>
          <td class="${cls}">${f.rate}</td>
          <td class="${cls}">${f.apr}</td>
          <td>${f.action}</td>
          <td>$${f.oi}</td>
        </tr>`;
      }
      fundHtml += '</table>';
      document.getElementById('funding').innerHTML = fundHtml;
    }
    
  } catch(e) {
    console.error('Failed to load data:', e);
  }
}
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
